name: Release authentication check

on:
  push:
    branches: [codex/release-auth-check-44658794580]

permissions:
  contents: read

jobs:
  probe:
    name: Release token API permissions
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub API access
        shell: bash
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.RELEASE_PR_TOKEN}`,
          };
          const checks = [
            ['/user', body => ({login: body.login ?? null})],
            ['/repos/affisto/cms-editor', body => ({push: body.permissions?.push === true})],
          ];
          for (const [path, select] of checks) {
            try {
              const response = await fetch(`https://api.github.com${path}`, {
                headers,
                redirect: 'error',
                signal: AbortSignal.timeout(10000),
              });
              const details = response.ok ? select(await response.json()) : {};
              console.log(`${path} HTTP ${response.status} ${JSON.stringify(details)}`);
            } catch {
              console.log(`${path} HTTP unavailable`);
              process.exitCode = 1;
            }
          }
          JS

  default-token:
    name: Checkout with default token and persisted credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

  release-token:
    name: Checkout with release token and temporary credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PR_TOKEN }}
